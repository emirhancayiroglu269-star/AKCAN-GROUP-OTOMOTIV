# AKCAN veritabanı yedeği — her gece 03:30 (Türkiye).
# Bu dosya AYRI ve GİZLİ (private) yedek deposunda .github/workflows/yedek.yml olarak durur (kaynağı: AKCAN deposu araclar/yedek/yedek.yml).
# Gerekli sırlar (yedek deposu > Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL : Supabase > Connect > "Session pooler" bağlantı adresi (şifre dahil)
#   YEDEK_SIFRE     : yedek dosyalarını şifreleyen parola (en az 20 karakter; kaybolursa yedekler açılamaz)
# Güvenlik: sırlar yalnız ortam değişkeni / dosya tanıtıcısıyla kullanılır; bağlantı adresi parçalanıp her parçası
#           loglarda maskelenir; hiçbir adım sırrı ekrana yazmaz. Canlı veritabanına yalnız okur; tek yazdığı yedek_kayit'e bir satırdır.
# Adımlar: 1) yedek  2) AES-256 ile şifrele, SHA-256 özetini al  3) şifreyi çözüp özeti ve yedeğin içindekiler listesini doğrula
#          4) ŞİFRESİ ÇÖZÜLEN dosyayı boş PostgreSQL 17'ye geri yükle, her tablonun satır sayısını canlıyla karşılaştır
#          5) şifreli dosyayı 14 gün sakla  6) sonucu AKCAN'a yaz (Ayarlar > Yedekler). Herhangi bir adım hata verirse iş kırmızı biter
#             ve GitHub hesabınıza "Run failed" e-postası gönderir.
name: Veritabanı yedeği
on:
  schedule: [{ cron: '30 0 * * *' }]
  workflow_dispatch:
  push:                        # iş dosyası güncellenince bir kez çalışır (ilk kurulum ve değişiklik sonrası deneme)
    paths: ['.github/workflows/yedek.yml']
permissions: { contents: read }
concurrency: { group: yedek, cancel-in-progress: false }
jobs:
  yedek:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      pg:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 30
    env:
      TEST_URL: postgresql://postgres:test@localhost:5432/postgres?sslmode=disable   # yerel test veritabanı (SSL yok)
    steps:
      - name: Sırları hazırla (maskeli)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SIFRE: ${{ secrets.YEDEK_SIFRE }}
        run: |
          set +x
          if [ -z "$DB_URL" ] || [ -z "$SIFRE" ]; then echo "::error::SUPABASE_DB_URL ve YEDEK_SIFRE sırları girilmemiş"; exit 1; fi
          if [ ${#SIFRE} -lt 20 ]; then echo "::error::YEDEK_SIFRE en az 20 karakter olmalı"; exit 1; fi
          # bağlantı adresini libpq ortam değişkenlerine böl; her parçayı loglarda maskele (adres hiçbir komutta açık geçmez)
          python3 - <<'PY'
          import os, urllib.parse as u
          import re
          adres = os.environ['DB_URL'].strip()
          # şifrede @ / # ? : gibi karakterler olabilir: kullanıcı ilk ':' ile, sunucu SON '@' ile ayrılır (URL kodlamasına gerek yok)
          m = re.match(r'^postgres(?:ql)?://([^:/@]+):(.*)@([A-Za-z0-9.-]+)(?::(\d+))?/([^?#]*)', adres, re.S)
          if not m:
              raise SystemExit('::error::SUPABASE_DB_URL biçimi tanınmadı (postgresql://kullanici:sifre@sunucu:5432/postgres bekleniyor). Supabase > Connect > Session pooler adresini kopyalayıp yalnız şifreyi yazın.')
          kul, sif, host, port, db = m.groups()
          # hangi şablon parçasının kaldığını söyler (bunlar Supabase'in örnek metni; gerçek bilgi yazdırılmaz)
          if re.search(r'YOUR-PASSWORD', adres, re.I): raise SystemExit('::error::SUPABASE_DB_URL içinde [YOUR-PASSWORD] yazısı duruyor: köşeli parantezleriyle silip yerine veritabanı şifresini yazın.')
          if re.search(r'<[a-z-]+>', host): raise SystemExit('::error::SUPABASE_DB_URL sunucu kısmında <region> gibi bir yer tutucu duruyor: Connect ekranındaki gerçek adresi (ör. aws-0-eu-central-1.pooler.supabase.com) kopyalayın.')
          if not sif: raise SystemExit('::error::SUPABASE_DB_URL içinde şifre boş.')
          if '%' in sif:
              try: sif = u.unquote(sif, errors='strict')
              except Exception: pass
          if port == '6543':   # işlem (transaction) modu yedek almaya uygun değil: aynı sunucuda oturum (session) modu 5432
              print('::warning::Adres 6543 (transaction pooler) portunda; yedek için 5432 (session pooler) kullanılıyor.'); port = '5432'
          v = {'PGHOST': host, 'PGPORT': port or '5432', 'PGUSER': kul, 'PGPASSWORD': sif, 'PGDATABASE': db or 'postgres'}
          for k in ('PGHOST', 'PGUSER', 'PGPASSWORD'): print('::add-mask::' + v[k])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for k, x in v.items(): f.write(f'{k}={x}\n')
              f.write('PGSSLMODE=require\nPGCONNECT_TIMEOUT=30\n')
          PY
          # şifreleme parolası yalnız iş klasörü dışında, yalnız bu kullanıcının okuyabildiği bir dosyada
          umask 077; printf '%s' "$SIFRE" > "$RUNNER_TEMP/yedek_sifre"
          echo "SIFRE_DOSYA=$RUNNER_TEMP/yedek_sifre" >> "$GITHUB_ENV"
      - name: PostgreSQL 17 istemcisi
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Satır sayıları (yedekten önce)
        run: |
          psql -v ON_ERROR_STOP=1 -At -F $'\t' > once.tsv <<'SQL'
          select format('select %L, count(*) from public.%I', c.relname, c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' order by 1 \gexec
          SQL
          echo "canlı tablo sayısı: $(wc -l < once.tsv)"
      - name: Yedek al
        run: |
          mkdir -p yedek
          pg_dump -Fc -Z 9 --no-owner --no-privileges -n public -f yedek/public.dump
          pg_dump --data-only --no-owner -t auth.users -t auth.identities -f yedek/auth_hesaplar.sql
          psql -v ON_ERROR_STOP=1 -At -c "select jobname, schedule, command from cron.job order by 1" > yedek/cron_gorevleri.tsv
          cp once.tsv yedek/satir_sayilari.tsv
          (cd yedek && sha256sum public.dump auth_hesaplar.sql cron_gorevleri.tsv satir_sayilari.tsv > ICERIK.sha256)
          pg_restore -l yedek/public.dump > /dev/null   # yedeğin içindekiler listesi okunabiliyor mu
          ls -la yedek
      - name: Satır sayıları (yedekten sonra)
        run: |
          psql -v ON_ERROR_STOP=1 -At -F $'\t' > sonra.tsv <<'SQL'
          select format('select %L, count(*) from public.%I', c.relname, c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' order by 1 \gexec
          SQL
      - name: Şifrele ve bütünlüğü doğrula
        run: |
          T=$(date -u +%Y%m%d-%H%M); DOSYA="akcan-yedek-$T.tar.gz.gpg"
          tar -cf - yedek | gzip -1 | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-file "$SIFRE_DOSYA" --symmetric --cipher-algo AES256 -o "$DOSYA"
          sha256sum "$DOSYA" > "$DOSYA.sha256"
          # şifreli mi: dosya OpenPGP şifreli paket olmalı, düz yedek imzası (PGDMP) içermemeli
          gpg --list-packets --batch --pinentry-mode loopback --passphrase-file "$SIFRE_DOSYA" "$DOSYA" 2>/dev/null | grep -q 'symkey enc packet' || { echo "::error::dosya şifreli görünmüyor"; exit 1; }
          if grep -a -q PGDMP "$DOSYA"; then echo "::error::şifreli dosyada düz yedek imzası bulundu"; exit 1; fi
          # şifreyi çöz, açılan dosyaların özetini yedek anındaki özetle karşılaştır
          rm -rf dogrula && mkdir dogrula
          gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$SIFRE_DOSYA" -d "$DOSYA" | tar -xzf - -C dogrula
          (cd dogrula/yedek && sha256sum -c ICERIK.sha256)
          echo "DOSYA=$DOSYA" >> "$GITHUB_ENV"
          echo "OZET=$(cut -d' ' -f1 "$DOSYA.sha256")" >> "$GITHUB_ENV"
          echo "BOYUT=$(python3 -c "import os;print(round(os.path.getsize('$DOSYA')/1048576,1))")" >> "$GITHUB_ENV"
          ls -la "$DOSYA"
      - name: Şifresi çözülen yedeği boş veritabanına geri yükle ve karşılaştır
        id: test
        run: |
          # Supabase'e özgü roller, auth fonksiyonları ve eklentiler (geri yüklenen tanımlar bunlara başvurur)
          psql "$TEST_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema auth; create schema extensions; create schema cron; create schema net;
          create function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          create function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create function auth.email() returns text language sql stable as $$ select null::text $$;
          create function auth.role() returns text language sql stable as $$ select null::text $$;
          create extension pgcrypto schema extensions; create extension "uuid-ossp" schema extensions;
          SQL
          # eklenti, yayın (realtime) ve public şemasının kendisi boş veritabanında zaten var ya da gereksiz: listeden çıkarılır
          pg_restore -l dogrula/yedek/public.dump | grep -v -E ' EXTENSION | PUBLICATION |COMMENT - EXTENSION| SCHEMA - public |COMMENT - SCHEMA public' > liste.txt
          set +e
          pg_restore -d "$TEST_URL" --no-owner --no-privileges -L liste.txt dogrula/yedek/public.dump 2> restore_hata.txt
          set -e
          HATA=$(grep -c 'ERROR' restore_hata.txt || true)
          echo "geri yükleme hata sayısı: $HATA"; [ "$HATA" = "0" ] || head -c 2000 restore_hata.txt
          psql "$TEST_URL" -v ON_ERROR_STOP=1 -At -F $'\t' > geri.tsv <<'SQL'
          select format('select %L, count(*) from public.%I', c.relname, c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' order by 1 \gexec
          SQL
          # her tablo: geri yüklenen satır sayısı, yedekten önceki ve sonraki canlı sayının arasında olmalı (eşitleme o sırada yazıyor olabilir)
          python3 - <<'PY' > sonuc.json
          import json
          def oku(f): return {a: int(b) for a, b in (l.rstrip('\n').split('\t') for l in open(f) if '\t' in l)}
          o, s, g = oku('once.tsv'), oku('sonra.tsv'), oku('geri.tsv')
          fark = {}
          for t in sorted(set(o) | set(s)):
              lo, hi = min(o.get(t, 0), s.get(t, 0)), max(o.get(t, 0), s.get(t, 0))
              if t not in g: fark[t] = 'geri yüklenmedi'
              elif not lo <= g[t] <= hi: fark[t] = f'{g[t]} (canlı {lo}-{hi})'
          print(json.dumps({'tablo': len(g), 'satir': sum(g.values()), 'fark': fark}))
          PY
          python3 -c "import json;s=json.load(open('sonuc.json'));print('geri yüklenen tablo:',s['tablo'],'satır:',s['satir'],'farklı tablo:',len(s['fark']))"
          echo "hata=$HATA" >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys;s=json.load(open('sonuc.json'));sys.exit(1 if s['fark'] else 0)" || { echo "::error::satır sayısı canlıdan farklı tablolar var"; exit 1; }
          [ "$HATA" = "0" ] || { echo "::error::geri yüklemede hata"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DOSYA }}
          path: |
            ${{ env.DOSYA }}
            ${{ env.DOSYA }}.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Sonucu AKCAN'a yaz
        if: always()
        env:
          IS: ${{ job.status }}
          RUN: ${{ github.run_id }}
          HATA: ${{ steps.test.outputs.hata }}
        run: |
          python3 - > kayit.sql <<'PY'
          import json, os
          try: s = json.load(open('sonuc.json'))
          except Exception: s = {}
          hata = os.environ.get('HATA') or ''
          ozet, boyut = os.environ.get('OZET'), os.environ.get('BOYUT')
          if not s or hata not in ('', '0'): gy = 'hata'
          else: gy = 'fark_var' if s.get('fark') else 'basarili'
          basarili = os.environ.get('IS') == 'success' and gy == 'basarili' and bool(ozet)
          q = lambda v: 'null' if v in (None, '') else "'" + str(v).replace("'", "''") + "'"
          aciklama = f"GitHub Actions çalışması {os.environ.get('RUN', '')}" + ('' if basarili else ' — başarısız; ayrıntı GitHub işinde')
          print("insert into public.yedek_kayit (durum, boyut_mb, sha256, sifreli, tablo_sayisi, satir_sayisi, geri_yukleme, fark, aciklama) values ("
                f"{q('basarili' if basarili else 'hata')}, {boyut or 'null'}, {q(ozet)}, {'true' if ozet else 'null'}, {s.get('tablo', 'null')}, {s.get('satir', 'null')}, {q(gy)}, "
                f"{q(json.dumps(s['fark'], ensure_ascii=False)) if s.get('fark') else 'null'}, {q(aciklama)});")
          PY
          psql -v ON_ERROR_STOP=1 -q -f kayit.sql && echo "sonuç AKCAN'a yazıldı" || echo "::warning::yedek_kayit tablosuna yazılamadı"
      - name: Geçici dosyaları sil
        if: always()
        run: rm -rf yedek dogrula "$SIFRE_DOSYA" kayit.sql
